services:
  backend:
    image: dasl-backend:latest
    container_name: dasl-backend

    restart: unless-stopped

    ports:
      - "3010:3001"

    environment:
      DB_HOST: "192.168.110.145"
      DB_PORT: "5432"
      DB_USER: "casaos"
      DB_PASSWORD: "casaos"
      DB_NAME: "dasl"

      PORT: "3001"
      HOST: "0.0.0.0"
      API_TIMEOUT: "30000"
      CORS_ORIGIN: "*"
      BODY_LIMIT: "50mb"

      NODE_ENV: "production"

      REDIS_HOST: "192.168.110.145"
      REDIS_PORT: "6379"

    volumes:
      - /DATA/AppData/dasl/logs:/app/logs

    networks:
      - dasl-network

    healthcheck:
      test: ["CMD-SHELL", "node healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dasl-network:
    driver: bridge
